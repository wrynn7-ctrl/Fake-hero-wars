<!DOCTYPE html>
<!--
  Hero Pins — index.html
  Page shell, dark-fantasy styling and DOM overlays (title, level select, HUD,
  victory / defeat screens). The game itself is drawn on the canvas by js/*.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hero Pins</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --gold: #ffd25a;
    --gold-dark: #a9741c;
    --ink: #f4e9d0;
    --panel: rgba(24, 16, 30, 0.94);
    --panel-edge: #6b4a1e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, #241a30 0%, #0c0910 75%);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #app {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column;
  }
  #hud {
    height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 4px;
    font-size: 14px; visibility: hidden;
  }
  #hud.show { visibility: visible; }
  #hud .info { flex: 1; display: flex; flex-direction: column; line-height: 1.25; white-space: nowrap; overflow: hidden; min-width: 0; }
  #hud .lvl { color: var(--gold); font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
  #hud .stat { opacity: 0.9; font-size: 13px; }
  #stage { position: relative; }
  canvas { display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.7), 0 0 0 2px #3a2a16; }
  canvas.pointer { cursor: pointer; }
  button {
    font-family: inherit; font-weight: bold; color: #2a1704; cursor: pointer;
    background: linear-gradient(#ffe99a, #e7b33f 55%, #b9801f);
    border: 2px solid #6b4211; border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 3px 0 #5a3609, 0 5px 10px rgba(0,0,0,0.5);
    padding: 10px 18px; font-size: 18px; text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 1px 0 #5a3609; }
  button.small { padding: 5px 9px; font-size: 13px; border-radius: 8px; }
  button.ghost { background: linear-gradient(#5b4a6a, #3a2d48); color: var(--ink); border-color: #241a30; text-shadow: none; }
  .screen {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center;
    background: rgba(8, 5, 12, 0.72); border-radius: 6px; padding: 20px;
  }
  .screen.show { display: flex; }
  .screen.opaque { background: radial-gradient(ellipse at 50% 35%, #3b2650 0%, #160f1f 70%); }
  .panel {
    background: var(--panel); border: 2px solid var(--panel-edge); border-radius: 16px;
    box-shadow: 0 0 0 2px #1b1108, 0 10px 40px rgba(0,0,0,0.7), inset 0 0 30px rgba(255,190,80,0.08);
    padding: 22px 26px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    min-width: 250px;
  }
  h1 {
    margin: 0; font-size: 56px; letter-spacing: 2px; color: var(--gold);
    text-shadow: 0 3px 0 #6b3d08, 0 0 24px rgba(255,190,60,0.55);
  }
  h2 { margin: 0; font-size: 34px; color: var(--gold); text-shadow: 0 2px 0 #6b3d08, 0 0 18px rgba(255,190,60,0.4); }
  .sub { margin: 0; opacity: 0.85; font-style: italic; max-width: 300px; }
  .stars { font-size: 40px; letter-spacing: 6px; color: #4a3a2a; text-shadow: 0 2px 0 #000; }
  .stars .on { color: var(--gold); text-shadow: 0 0 12px rgba(255,210,90,0.8), 0 2px 0 #6b3d08; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .reason { font-size: 20px; color: #ffb39a; margin: 0; }
  #levelGrid { display: grid; grid-template-columns: repeat(3, 84px); gap: 12px; }
  .tile {
    height: 84px; width: 84px; border-radius: 12px; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .tile .num { font-size: 28px; }
  .tile .tstars { font-size: 14px; letter-spacing: 1px; color: #6b4a1e; }
  .tile .tstars .on { color: #fff3b0; text-shadow: 0 0 6px #ffb000; }
  .tile.locked { background: linear-gradient(#4a4152, #2b2433); color: #8a7f94; border-color: #1a141f; cursor: not-allowed; box-shadow: none; }
  .tile.locked:hover { filter: none; }
  .tile:last-child { grid-column: 2; }
  .knight-deco { font-size: 13px; letter-spacing: 3px; color: #c9a25a; opacity: 0.8; text-transform: uppercase; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="info">
      <span class="lvl" id="hudLevel">Level 1</span>
      <span class="stat" id="hudStats">Pulls 0</span>
    </div>
    <button class="small" id="btnHint" title="Show the next pin (max 2 stars)">Hint</button>
    <button class="small" id="btnRestart" title="Restart level">Restart</button>
    <button class="small ghost" id="btnMenu" title="Back to menu">Menu</button>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>

    <div class="screen opaque show" id="scrTitle">
      <div class="knight-deco">&#9876; a pull-the-pin quest &#9876;</div>
      <h1>Hero Pins</h1>
      <p class="sub">Pull the pins in the right order. Bring the gold to the knight, keep the lava and monsters away.</p>
      <div class="row" style="flex-direction:column">
        <button id="btnPlay">Play</button>
        <button class="ghost" id="btnSelect">Level Select</button>
      </div>
    </div>

    <div class="screen opaque" id="scrLevels">
      <h2>Choose a Level</h2>
      <div id="levelGrid"></div>
      <button class="ghost" id="btnLevelsBack">Back</button>
    </div>

    <div class="screen" id="scrWin">
      <div class="panel">
        <h2>Victory!</h2>
        <div class="stars" id="winStars"></div>
        <p class="sub" id="winText"></p>
        <div class="row">
          <button id="btnNext">Next level</button>
        </div>
        <div class="row">
          <button class="small ghost" id="btnReplay">Replay</button>
          <button class="small ghost" id="btnWinMenu">Menu</button>
        </div>
      </div>
    </div>

    <div class="screen" id="scrLose">
      <div class="panel">
        <h2>Defeat</h2>
        <p class="reason" id="loseReason"></p>
        <div class="row">
          <button id="btnRetry">Retry</button>
          <button class="small ghost" id="btnLoseMenu">Menu</button>
        </div>
      </div>
    </div>

    <div class="screen opaque" id="scrFinal">
      <div class="panel">
        <h2>Champion!</h2>
        <p class="sub">You beat all 10 levels!</p>
        <div class="stars" id="finalStars"></div>
        <div class="row">
          <button id="btnFinalLevels">Level Select</button>
          <button class="ghost" id="btnFinalMenu">Menu</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/physics.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
